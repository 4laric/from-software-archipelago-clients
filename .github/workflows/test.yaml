name: Test

on:
  pull_request:
  # PUSH GATE (2026-07-11). This used to fire on pull_request ONLY -- and agents push straight to
  # `main`, so it never ran. Three consecutive Windows build round-trips were burned on symbol names
  # (ItemLotParam_map, ITEMLOT_PARAM_ST, set_lot_item_id01..08) that this workflow would have caught
  # for free on a GitHub runner. Gate the branch people actually push to.
  # EVERY BRANCH, not just main (2026-08-13). A side branch used to run NOTHING, so the first clean-
  # environment build of any work happened when a PR opened -- or, for work that never opened one, on
  # the maintainer's box and nowhere else. That is the whole reason a release .dll has historically
  # been "built separately": there was no other machine that built it.
  #
  # 🛑 THIS IS ONLY AFFORDABLE BECAUSE THE CACHE STOPPED THRASHING in the same commit. Widening the
  # trigger without the `save-if` below would have made it worse: more branches x 585 MB per cache,
  # against a 10 GB repo limit that was ALREADY over.
  push:
    branches: ['**']
  # Manual kick. Actions is DISABLED BY DEFAULT ON FORKS and this repo is a fork of
  # fswap/from-software-archipelago-clients -- so the workflow read as `state: active` while having
  # literally never run (total_count: 0). Enabled 2026-07-12 after it let three broken builds through
  # to Alaric in a row. Keep a dispatch trigger so the gate can be re-proved without a dummy commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    runs-on: windows-latest

    # 🛑 DON'T RUN TWICE FOR THE SAME COMMIT. With `push: '**'` above, a branch in THIS repo fires
    # `push`, and opening a PR from it fires `pull_request` for the same sha -- two identical
    # windows-latest jobs, two of everything. Skip the pull_request copy when the PR comes from this
    # repo (the push job already covered that sha), and keep it for FORKS, which produce no push
    # event here and would otherwise go untested.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
    - uses: actions/checkout@v4

    # 🛑 ASK FOR THE TOOLCHAIN THE REPO PINS. `rust-toolchain.toml` says `nightly`, so every cargo
    # invocation below resolves through rustup to nightly regardless of what this step installs --
    # this used to say `@stable`, which meant the job installed one toolchain and built with another,
    # and `Swatinem/rust-cache` keyed the cache on the version of the one that was NOT used.
    # `dtolnay/rust-toolchain@master` + an explicit `toolchain:` makes the two agree.
    #
    # Nightly is not a preference here: stable rustfmt ignores `format_generated_files = false` and
    # rewrites the @generated files, which is a red on a file nobody edited.
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        targets: x86_64-pc-windows-msvc
        components: clippy, rustfmt
    # 🛑🛑 SAVE ONLY FROM main. MEASURED 2026-08-13: 18 cache entries, ~585 MB each, **10,530 MB
    # against a 10,240 MB repo limit**. The cache was over its own ceiling, so GitHub was evicting
    # LRU entries faster than runs could use them and a push to main logged `No cache found` and
    # compiled **258 crates** from scratch. The cache was not cold because caching was hard; it was
    # cold because we were storing three copies of it.
    #
    # Every distinct `Cargo.lock` spawns a fresh ~585 MB family, and previously main AND each PR
    # branch saved their own copy of that family. Restores are unaffected by this change: a PR still
    # reads main's cache, because Actions makes the default branch's caches visible to every branch.
    # Only the writes stop.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # ORDER MATTERS (2026-07-12). These steps used to run fmt -> clippy -> build -> test, and every
    # step is fail-fast, so a style lint SKIPS the build. On the first run this repo ever did, that is
    # exactly what happened: `cargo fmt` failed, and clippy/build/test never executed -- while three
    # genuine compile errors sat on main (a stray brace, a dangling {gate} capture, and a call into
    # er_semver, which is not even a dependency). A gate that lets a compile error through because a
    # doc-comment bullet was misindented is not a gate.
    #
    # So: BUILD and TEST first. They answer "is main broken?" -- the question worth failing on.
    # Style runs after, and can still fail the job, but never masks a broken build again.
    - run: cargo build
    # eldenring-archipelago was BUILT but never TESTED, so key_resolver.rs's tests -- the Bedrock
    # slot-key adapter, i.e. the thing that lets our client drive a foreign apworld -- had never
    # once run in CI. Same for the foreign-apworld DEGRADATION tests in region.rs / fogwall.rs,
    # which encode a promise made in writing: an apworld that emits none of our keys must still
    # yield a playable vanilla seed. A promise with no test is a rumour.
    #
    # `shared` ADDED 2026-08-01, same lesson one crate over. It was BUILT here and never TESTED,
    # so its unit tests ran nowhere -- including the 7 in `foreign_blocks.rs`, the module whose
    # HIT/MISS verdict the FMG CTD diagnosis rests on, and every test in `crash_handler.rs`.
    # An instrument whose own tests never run is the shape of #244: a gate that reports nothing.
    #
    # `archipelago_rs` ADDED 2026-08-04, when it was vendored in. Same lesson a third time: a
    # vendored crate that CI builds but never tests is a crate whose tests run nowhere. Its
    # suite is the regression gate for the ReceivedItems batch drop -- omit it here and the
    # gate reports nothing.
    #
    # `bb-archipelago` ADDED 2026-08-19. The first equipment-descriptor PR exposed the same
    # omission again: workspace build/clippy compiled the Bloodborne crate, but this explicit
    # package list skipped its receive-ledger and fail-closed descriptor tests entirely.
    - run: cargo test -p er-codec -p er-semver -p er-logic -p eldenring-archipelago -p shared -p archipelago_rs -p bb-archipelago

    - run: cargo fmt -- --check
    # RE-ARMED 2026-07-12. eldenring-archipelago had 44 accumulated lints -- the whole backlog of a crate
    # clippy had never once linted, because Actions is disabled by default on forks and this repo is one.
    # All 44 are now cleared, so clippy blocks again. It is a HARD gate: the debt got in precisely because
    # nothing was stopping it.
    #
    # 🛑 `--all-targets` ADDED 2026-08-15 (client#198). Without it clippy lints the LIB targets
    # only, so `#[cfg(test)]` code -- which in `er-logic` means the `*_replay.rs` harnesses, i.e.
    # the acceptance tests for the whole crate -- was never linted at all. 18 errors were sitting
    # behind the flag on the commit that added it, cleared in the commit before this one. Order
    # mattered: the flag first would have reddened `main` for everyone else's branches.
    #
    # This is the same lesson as `-p shared` / `-p archipelago_rs` in the test step above, one gate
    # over: a check that silently excludes the test code reports on less than a reader assumes.
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo clippy --all-targets --features=profile -- -D warnings

    # -------------------------------------------------------------------------------------------
    # THE ARTIFACT. Until now this job built the .dll and threw it away, so the only machine that
    # produced a runnable client was the maintainer's -- which is why "it works on my box" has been
    # an untestable claim and why `er-archipelago/.github/workflows/release.yaml` records the bundle
    # as "a Windows-built manual upload". That file says the release runner "cannot build" the .dll;
    # true of THAT runner, which is ubuntu-latest, and not of this one, which has been building it
    # on every PR for a month.
    #
    # 🛑 RELEASE, NOT DEBUG. `cargo build` above is the compile gate and stays debug (faster, and
    # `-D warnings` is what it is there for). A .dll someone is going to load into the game wants
    # optimisation, and a debug cdylib for this workspace is an order of magnitude larger.
    #
    # 🛑 THIS IS NOT A RELEASE. It is a build anyone can download and run, on any branch, so a
    # playtest no longer waits on one person's environment. The hash-matched-pair rule in
    # release/DISTRIBUTION.md still governs what may be handed to a PLAYER: this .dll is paired with
    # nothing, so the artifact name carries the sha and the retention is short on purpose.
    # 🛑 WORKSPACE-WIDE AGAIN as of 2026-08-15 (client#191). This step carried `-p
    # eldenring-archipelago` for a knowing reason: a bare `cargo build --release` was RED, because
    # `-D warnings` (set in this file's env) plus `--release` turned `unused import:
    # regex_macro::regex` into an error in `ds3-archipelago` and `sdt-archipelago` -- the import is
    # reached only from a `#[cfg(debug_assertions)]` arm and release compiles that away. Their own
    # pipelines never saw it because ds3-release.yaml / sdt-release.yaml do not set `-D warnings`;
    # it was this file's stricter env meeting a profile it had never been run under.
    #
    # The import is now gated with the same cfg as its use site, so the deferral has nothing left to
    # defer. Widening the step is the point: scoped to one crate, this gate could never have
    # NOTICED the fix, and a release-only warning in a sibling crate would have gone on being
    # invisible here forever. The .dll the artifact step uploads is unaffected -- a workspace
    # release build still produces it.
    - run: cargo build --release

    - uses: actions/upload-artifact@v4
      with:
        name: eldenring_archipelago-${{ github.sha }}
        path: target/release/eldenring_archipelago.dll
        if-no-files-found: error
        # Short on purpose: these are build outputs, not releases, and artifact storage is the same
        # quota the cache above just got evicted out of.
        retention-days: 14

    # Bloodborne is a standalone companion client rather than an injected DLL.
    # The workspace release build above already produces it; retain the executable
    # beside the Elden Ring artifact so playtesters do not need a Rust toolchain.
    - uses: actions/upload-artifact@v4
      with:
        name: bloodborne_ap_client-${{ github.sha }}
        path: target/release/bb-ap-client.exe
        if-no-files-found: error
        retention-days: 14
