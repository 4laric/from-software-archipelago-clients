[workspace]
resolver = "2"
members = [
    "crates/archipelago-rs",
    "crates/bb-archipelago",
    "crates/client-ui",
    "crates/ds3-archipelago",
    "crates/sdt-archipelago",
    "crates/shared",
    "crates/standalone-windows",
    # --- Elden Ring (DRAFT) -------------------------------------------------
    # Alaric's Phase-5 ER runtime client + its two pure-logic crates.
    # Not yet converged onto `shared`; see the PR description for the WIP list.
    "crates/eldenring-archipelago",
    "crates/er-codec",
    "crates/er-semver",
    "crates/er-logic",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/fswap/fromsoftware-archipelago"

[workspace.dependencies]
anyhow = "1.0.102"
archipelago_rs = { path = "crates/archipelago-rs" }
bincode = "2.0.0"
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs" }
fromsoftware-extra-shared = { git = "https://github.com/nex3/fromsoftware-extra", branch = "sekiro-save" }
hudhook = "0.9.0"
ilhook = {version = "2.3.0", features = ["x64"]}
json = { package = "serde_json", version = "1.0.149" }
log = "0.4.29"
regex = "1.12.3"
regex-macro = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_repr = "0.1.20"
sha2 = "0.10.9"
shared = { path = "crates/shared"}

[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    # Diagnostics_Debug + Kernel: the crash handler (shared::crash_handler) — vectored/unhandled
    # exception registration lives in Diagnostics_Debug; EXCEPTION_POINTERS/CONTEXT are gated on
    # Win32_System_Kernel.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    # Win32_System_Diagnostics_ToolHelp: thread enumeration for the native-delivery
    # install atomicity protocol (crates/bb-archipelago/src/native/threads.rs).
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    # Media_Audio: the multiworld-pickup audio cue (client#336) — PlaySoundW + SND_* flags live in
    # Win32_Media_Audio (the bare Win32_Media feature does not include the Audio module).
    "Win32_Media_Audio",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
]

[patch.crates-io]
imgui = { git = "https://github.com/imgui-rs/imgui-rs" }
imgui-sys = { git = "https://github.com/imgui-rs/imgui-rs" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs" }
darksouls3 = { git = "https://github.com/vswarte/fromsoftware-rs" }
sekiro = { git = "https://github.com/vswarte/fromsoftware-rs" }

