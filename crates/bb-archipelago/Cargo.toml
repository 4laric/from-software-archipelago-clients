[package]
name = "bb-archipelago"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
build = "build.rs"

[[bin]]
name = "bb-ap-client"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
archipelago_rs.workspace = true
json.workspace = true
dynasmrt = "3.2.1"
serde.workspace = true
sha2.workspace = true
windows.workspace = true
oneshot = { version = "0.2.1", features = ["async", "std"] }
client-ui = { path = "../client-ui" }
standalone-windows = { path = "../standalone-windows" }

[build-dependencies]
winresource = { version = "=0.1.31", default-features = false }

# The egui window is the default renderer and the Win32 shell is the `--legacy-window` fallback.
# Both are Windows-only, and so is everything that spawns them.
[target.'cfg(windows)'.dependencies]
standalone-egui = { path = "../standalone-egui" }
