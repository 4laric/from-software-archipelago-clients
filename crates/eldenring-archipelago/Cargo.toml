[package]
name = "eldenring-archipelago"
# LOCKSTEP WITH THE APWORLD. This must equal contract.py's APWORLD_VERSION (mirrored here as
# contract_gen::APWORLD_VERSION_EXPECTED); core.rs::client_version_matches_the_apworld_it_was_built_against
# asserts it. The two ship together in one release bundle, and any APWORLD_VERSION change already
# regenerates contract_gen.rs into this repo, so the coupling costs nothing it did not already.
#
# WHY IT SAT AT 0.1.0-beta.4 FOR MONTHS: the thing that used to force it to move was a semver BAND
# gate (">=0.1.0-beta.4 <0.1.0-beta.5"), and that gate was RETIRED on 2026-07-11 -- `versions` became
# a descriptive "apworld/X contract/Y data/Z" string and the handshake compares the CONTRACT HASH
# instead. Nothing replaced the pressure, so the number simply stopped moving, and this comment went
# on describing a mechanism and a test that no longer existed. (`er_logic::version::version_gate` is
# now referenced only from a test; nothing in production reads this version, which is exactly why
# jumping 0.1.0-beta.4 -> the 0.2.x line is safe. The old er-semver warning that a bare
# 0.1.0 outranks every 0.1.0-beta.* is likewise moot -- no range is parsed any more.)
version = "0.5.5"
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = false

[lib]
crate-type = ["cdylib"]
name = "eldenring_archipelago"

[dependencies]
# update_check's HTTPS GET for /er/latest.json. SAME versions archipelago-rs already resolves
# (its rustls feature), so this adds links, not a second copy in the tree.
rustls = "0.23.36"
webpki-roots = "1.0.6"
anyhow.workspace = true
archipelago_rs.workspace = true        # ensure the workspace is on 3.0.1 (try-ap-3x) so ER seeds connect
# Track the SAME ref as `eldenring` below (NOT `.workspace`, which is the 0.13 default-branch source
# the lock pins to 893cdd37). `main` is 0.14, whose eldenring ships RVAs for ER 2.6.2.0 (current
# game). Within this crate that gives ONE fromsoftware-shared (0.14) copy, so CSTaskImp's
# `SharedTaskImp` impl and our `use fromsoftware_shared::SharedTaskImpExt` agree. The framework
# (shared)/ds3/sekiro keep their own 0.13 copy untouched — the two never trade fss types across
# `shared::Game` (which exposes only `impl FnMut`/`bool`/hudhook).
# 🛑 PINNED, not floated (#241). This file said "Pin the resolved SHA after build" for months while
# both entries tracked `branch = "main"`, so every build re-resolved whatever upstream HEAD was that
# day. The RVA table that decides which Elden Ring executable this build supports lives in THIS
# dependency -- it is the table #233's gate reports against -- and Tarnished Edition (2026-08-28)
# bumps that executable. A release has to be able to say which revision answered for it.
# The rev below is the SHA `branch = "main"` had ALREADY resolved to, so this pin changes no code;
# it only stops the next change from being silent. Bump it deliberately, in its own PR.
# 🛑🛑 THIN FORK PIN (#241, Tarnished Edition). Both git deps below point at
# 4laric/fromsoftware-rs @ 8c0afd1b = upstream vswarte/fromsoftware-rs `0b44ede3` (PR #320, the
# GENERATED RVA tables for game 1.17.0 -- exe 2.7.0.0 WW and 2.7.0.1 JP) plus EXACTLY ONE commit.
# That commit restores the 2.6.2.0/2.6.2.1 tables and their `ERGameVersion` arms, which upstream
# DELETED in the same change that added 1.17.0. Upstream at that rev cannot serve a pre-Tarnished
# executable at all; we can, because players who did not update -- or who downgraded on purpose
# for an older Seamless Co-op or an older fifthmatt randomizer -- are on 2.6.2.x today.
# The restored tables are the old ones VERBATIM from upstream `8c67a84f`, not re-derived. The
# 2.7.0.x tables are untouched upstream output. (This retires the earlier `tarnished-2700-candidates`
# fork, whose derived 2.7.0.0 table upstream's generated one agrees with 93/93 exactly.)
# RETIRE THIS PIN when upstream re-adds pre-Tarnished support, or when this project drops 2.6.2.x:
# at that point both entries move straight back to vswarte/fromsoftware-rs and this note goes.
# Bump the rev deliberately, in its own PR, and keep game_version_gate.rs's arms in lockstep.
fromsoftware-shared = { git = "https://github.com/4laric/fromsoftware-rs", rev = "8c0afd1bbf7b7fea8ddd93a3ada2a8556b0d5a13" }
hudhook.workspace = true
# Item-tracker overlay window (shared::Core render_overlay_* hooks take &imgui::Ui). Same spec as
# crates/shared so the workspace [patch.crates-io] git pin resolves both to ONE imgui instance.
imgui = { version = "0.12", features = ["docking", "tables-api"] }
log.workspace = true
shared.workspace = true
windows.workspace = true
serde = { version = "1", features = ["derive"] }   # derive for the per-character WatermarkStore file
serde_json = "1"
retour = "0.3"   # stable GenericDetour for the AddItemFunc pickup hook (same as the standalone client)
# The version gate reads the running executable's PE version resource. Same major as the copy
# `fromsoftware-shared` already resolves, so this adds a name, not a build.
pelite = "0.10"
# save_backup: timestamped generation names. SAME "0.4" the build-dependency below already
# resolves, so this shares one copy in the tree.
chrono = "0.4"
oneshot = { version = "0.2.1", features = ["std"] }   # scout_proof: archipelago_rs hands back a oneshot::Receiver from scout_locations (VERIFY shape on 3.0.1)
# ER game bindings (0.14): rva.rs at this rev lists all four supported executables -- ER WW 2.7.0.0
# / JP 2.7.0.1 (upstream's generated 1.17.0 tables) and WW 2.6.2.0 / JP 2.6.2.1 (fork-restored).
# Must track the SAME ref as fromsoftware-shared above so
# they're ONE source instance (one fss copy → SharedTaskImp/SharedTaskImpExt resolve). Isolated from
# the workspace's 0.13 by being a different git ref than the framework's default-branch source.
eldenring = { git = "https://github.com/4laric/fromsoftware-rs", rev = "8c0afd1bbf7b7fea8ddd93a3ada2a8556b0d5a13" }
# ER pure-logic crates (host-tested).
er-codec = { path = "../er-codec" }
er-logic = { path = "../er-logic" }

[build-dependencies]
chrono = "0.4"   # build.rs: stamp ER_BUILD_TIME (UTC) into the binary for the connect banner

[features]
profile = ["shared/profile"]
